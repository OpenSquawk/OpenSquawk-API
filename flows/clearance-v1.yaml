slug: clearance-v1
schema_version: "2.0"
name: "IFR Clearance Delivery"
description: "Pilot contacts clearance delivery, receives an IFR departure clearance, and reads it back correctly before handing off to ground"

start_state: INITIAL_CALL
end_states:
  - CLEARANCE_COMPLETE

# Automatically chain to the ground / taxi flow once the clearance is complete.
next_flow: taxi-v1

entry_mode: main

variables:
  callsign:
    type: string
    initial: "DLH39A"
    mutable_by: action_only
  information:
    type: string
    initial: "K"
    mutable_by: action_only
  destination:
    type: string
    initial: "Munich"
    mutable_by: action_only
  stand:
    type: string
    initial: "A12"
    mutable_by: action_only
  sid:
    type: string
    initial: "BIBAX1N"
    mutable_by: action_only
  # Where the SID hands over to the enroute structure. Derived at session
  # create from the filed route (see app/enroute_route.py). The rest of the
  # route is covered by "flight planned route": ten-plus elements including
  # airways is not something a pilot reads back or STT survives.
  #
  # Empty list = no route was filed (demo and manual flights), and an empty
  # list requires nothing of the readback — which is why this is a list and
  # not a string. An unset or empty *string* in readback_required fails
  # grading, so every routeless flight would be stuck on the readback.
  enroute_fixes:
    type: list
    initial: []
    mutable_by: action_only
  # Ready-to-speak clause, e.g. ", then SULUS, flight planned route" or "".
  # Computed from enroute_fixes; rendering "" cleanly drops the clause, so a
  # flight without a route keeps the wording it has today.
  enroute_clause:
    type: string
    initial: ""
    mutable_by: action_only
  initial_altitude:
    type: string
    initial: "5000"
    mutable_by: action_only
  squawk:
    type: string
    initial: "2341"
    mutable_by: action_only
  ground_freq:
    type: string
    initial: "121.800"
    mutable_by: action_only

flags:
  clearance_issued:
    initial: false
  readback_correct:
    initial: false

states:

  INITIAL_CALL:
    role: pilot
    phase: clearance
    name: "Initial Call to Clearance Delivery"
    description: "Pilot calls clearance delivery with callsign, ATIS information code, destination, stand number, and request for IFR clearance"
    expected_pilot_template: "{{callsign}}, information {{information}}, IFR to {{destination}}, stand {{stand}}, request clearance"
    frequency_name: "Clearance Delivery"
    allow_greeting: true

    ok_next:
      - to: ATC_ISSUES_CLEARANCE
        trigger: "information|request.*clear|IFR|clearance|stand"
        label: "Pilot called clearance delivery with required elements"

    bad_next:
      - to: ATC_INITIAL_CALL_INCORRECT
        label: "Incomplete initial call — controller prompts for required elements"

    auto_transitions: []

  ATC_INITIAL_CALL_INCORRECT:
    role: atc
    phase: clearance
    name: "ATC Prompts for Correct Initial Call"
    description: "Controller asks the pilot to include all required elements: callsign, information code, destination, stand, and clearance request"
    say_template: "{{callsign}}, say again with information code, destination, stand number, and clearance request"
    frequency_name: "Clearance Delivery"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: INITIAL_CALL
        label: "Prompt given — pilot to retry initial call"

  ATC_ISSUES_CLEARANCE:
    role: atc
    phase: clearance
    name: "ATC Issues IFR Clearance"
    description: "Controller reads out the full departure clearance: destination, SID name, initial altitude, and squawk code"
    say_template: "{{callsign}}, cleared to {{destination}} via {{sid}} departure{{enroute_clause}}, climb initially {{initial_altitude}} feet, squawk {{squawk}}"
    frequency_name: "Clearance Delivery"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_READBACK
        label: "ATC finished reading clearance — awaiting pilot readback"
        on_enter_actions:
          - type: set_flag
            target: clearance_issued
            value: true

  PILOT_READBACK:
    role: pilot
    phase: clearance
    name: "Pilot Reads Back Clearance"
    description: "Pilot must read back destination, SID, initial altitude, squawk code, and own callsign"
    expected_pilot_template: "Cleared {{destination}}, {{sid}}{{enroute_clause}}, climb initially {{initial_altitude}}, squawk {{squawk}}, {{callsign}}"
    frequency_name: "Clearance Delivery"

    # The clearance limit is as safety-critical as the rest: a pilot who reads
    # back the wrong destination has misheard the clearance, even when SID,
    # level and squawk are verbatim correct.
    #
    # enroute_fixes is empty for a flight that filed no route, and an empty
    # list requires nothing — so a demo flight is graded exactly as before.
    readback_required:
      - destination
      - sid
      - initial_altitude
      - squawk
      - enroute_fixes
    readback_mode: simple

    ok_next:
      - to: ATC_READBACK_CORRECT
        trigger: ".*"
        label: "Readback evaluated by readback evaluator — correct"

    bad_next:
      - to: ATC_READBACK_INCORRECT
        trigger: ".*"
        label: "Readback missing required elements — controller corrects pilot"

    auto_transitions: []

  ATC_READBACK_INCORRECT:
    role: atc
    phase: clearance
    name: "ATC Corrects Readback"
    description: "Controller tells the pilot the readback was incomplete and repeats the critical items"
    say_template: "Negative, {{callsign}}, say again: {{sid}}{{enroute_clause}}, squawk {{squawk}}, climb initially {{initial_altitude}} feet"
    frequency_name: "Clearance Delivery"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_READBACK
        label: "Correction given — pilot to try again"

  ATC_READBACK_CORRECT:
    role: atc
    phase: clearance
    name: "ATC Confirms Readback"
    description: "Controller confirms the readback was correct and instructs pilot to contact ground for pushback"
    say_template: "Readback correct, {{callsign}}. Contact ground {{ground_freq}} when ready for pushback."
    frequency_name: "Clearance Delivery"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_GROUND_FREQ_READBACK
        label: "Clearance confirmed and ground frequency passed — awaiting frequency readback"
        on_enter_actions:
          - type: set_flag
            target: readback_correct
            value: true

  PILOT_GROUND_FREQ_READBACK:
    role: pilot
    phase: clearance
    name: "Pilot Reads Back Ground Frequency"
    description: "Pilot reads back the ground frequency and own callsign to confirm the frequency change"
    expected_pilot_template: "{{ground_freq}}, {{callsign}}"
    frequency_name: "Clearance Delivery"

    readback_required:
      - ground_freq
    readback_mode: simple

    ok_next:
      - to: ATC_CLEARANCE_HANDOFF_CONFIRMED
        trigger: ".*"
        label: "Ground frequency readback evaluated — correct"

    bad_next:
      - to: ATC_GROUND_FREQ_READBACK_INCORRECT
        label: "Readback missing the ground frequency — controller corrects"

    auto_transitions: []

  ATC_GROUND_FREQ_READBACK_INCORRECT:
    role: atc
    phase: clearance
    name: "ATC Corrects Ground Frequency Readback"
    description: "Controller repeats the ground frequency for the pilot"
    say_template: "Negative, {{callsign}}, ground on {{ground_freq}}"
    frequency_name: "Clearance Delivery"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_GROUND_FREQ_READBACK
        label: "Correction given — pilot to try again"

  ATC_CLEARANCE_HANDOFF_CONFIRMED:
    role: atc
    phase: clearance
    name: "Delivery Releases the Pilot to Ground"
    description: "Delivery acknowledges the correct frequency readback and releases the pilot"
    say_template: "{{callsign}}, good day"
    frequency_name: "Clearance Delivery"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: CLEARANCE_COMPLETE
        label: "Clearance phase complete"
        on_enter_actions:
          - type: log
            target: clearance_complete

  CLEARANCE_COMPLETE:
    role: system
    phase: clearance
    name: "Clearance Granted"
    description: "IFR clearance phase complete. Switch to ground {{ground_freq}} for pushback."

    ok_next: []
    bad_next: []
    auto_transitions: []

slug: ifr-tower-landing-v1
schema_version: "2.0"
name: "IFR Tower — Landing"
description: "IFR pilot established on the ILS contacts Tower, is cleared to land, lands and vacates the runway, then is handed off to Ground for taxi-in"

start_state: ESTABLISHED_CONTACT
end_states:
  - TOWER_LANDING_COMPLETE
  # A go-around does not end at the stand: the aircraft goes back to Approach
  # for another approach, so it gets its own terminal state.
  - TOWER_GO_AROUND_COMPLETE

# After vacating, the pilot taxis in to the stand on the Ground frequency.
next_flow: taxi-in-v1

entry_mode: main

variables:
  callsign:
    type: string
    initial: "DLH6RK"
    mutable_by: action_only
  runway:
    type: string
    initial: "26L"
    mutable_by: action_only
  surface_wind:
    type: string
    initial: "260/08"
    mutable_by: action_only
  ground_freq:
    type: string
    initial: "121.800"
    mutable_by: action_only
  approach_freq:
    type: string
    initial: "119.000"
    mutable_by: action_only
  # Missed-approach climb altitude. The real one comes from the approach chart;
  # this is the flow default for a session that supplies none.
  go_around_altitude:
    type: string
    initial: "3000"
    mutable_by: action_only

flags:
  landing_cleared:
    initial: false
  runway_vacated:
    initial: false
  # Set by the engine when it decides this approach is sent around, and read by
  # the guarded branch off the landing readback.
  go_around_triggered:
    initial: false
  go_around_flown:
    initial: false

states:

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Pilot reports established on the ILS to Tower
  # ─────────────────────────────────────────────────────────────────────────────
  ESTABLISHED_CONTACT:
    role: pilot
    phase: tower
    name: "Report Established to Tower"
    description: "Pilot calls Tower reporting established on the ILS for the landing runway"
    expected_pilot_template: "{{callsign}}, established ILS runway {{runway}}"
    frequency_name: "Tower"
    allow_greeting: true

    ok_next:
      - to: ATC_LANDING_CLEARANCE
        trigger: "establish|ils|localizer|localiser|loc|final|fully established"
        label: "Pilot reported established on the approach"

    bad_next:
      - to: ATC_ESTABLISHED_INCORRECT
        label: "Incomplete call — controller prompts to report established"

    auto_transitions: []

  ATC_ESTABLISHED_INCORRECT:
    role: atc
    phase: tower
    name: "ATC Prompts for Established Report"
    description: "Controller asks the pilot to report established on the ILS with the runway"
    say_template: "{{callsign}}, say again, report established ILS runway {{runway}}"
    frequency_name: "Tower"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: ESTABLISHED_CONTACT
        label: "Prompt given — pilot to retry"

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Tower clears the aircraft to land
  # ─────────────────────────────────────────────────────────────────────────────
  ATC_LANDING_CLEARANCE:
    role: atc
    phase: tower
    name: "Tower Issues Landing Clearance"
    description: "Tower passes the surface wind and clears the aircraft to land"
    say_template: "{{callsign}}, wind {{surface_wind}}, runway {{runway}}, cleared to land"
    frequency_name: "Tower"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_LANDING_READBACK
        label: "Landing clearance issued — await pilot readback"
        on_enter_actions:
          - type: set_flag
            target: landing_cleared
            value: true

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Pilot reads back the landing clearance
  # ─────────────────────────────────────────────────────────────────────────────
  PILOT_LANDING_READBACK:
    role: pilot
    phase: tower
    name: "Pilot Reads Back Landing Clearance"
    description: "Pilot reads back cleared to land and the runway — mandatory per ICAO"
    expected_pilot_template: "Cleared to land runway {{runway}}, {{callsign}}"
    frequency_name: "Tower"

    readback_required:
      - runway
    readback_mode: simple

    # Very occasionally Tower sends the approach around instead of confirming.
    # The engine rolls for it once the readback is graded correct — see
    # app/interventions.py.
    go_around_eligible: true

    ok_next:
      - to: ATC_GO_AROUND
        trigger: ".*"
        condition:
          type: flag_check
          name: go_around_triggered
        label: "Tower sends the approach around"
      - to: ATC_LANDING_READBACK_CORRECT
        trigger: ".*"
        label: "Landing readback evaluated — correct"

    bad_next:
      - to: ATC_LANDING_READBACK_INCORRECT
        label: "Readback missing runway — controller corrects"

    auto_transitions: []

  ATC_LANDING_READBACK_INCORRECT:
    role: atc
    phase: tower
    name: "ATC Corrects Landing Readback"
    description: "Controller repeats the runway for the landing clearance readback"
    say_template: "Negative, {{callsign}}, say again: runway {{runway}}, cleared to land"
    frequency_name: "Tower"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_LANDING_READBACK
        label: "Correction given — pilot to try again"

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Pilot reports the runway vacated after landing
  # ─────────────────────────────────────────────────────────────────────────────
  PILOT_RUNWAY_VACATED:
    role: pilot
    phase: tower
    name: "Pilot Reports Runway Vacated"
    description: "After landing, the pilot reports clear of the runway once past all holding positions"
    expected_pilot_template: "{{callsign}}, runway vacated"
    frequency_name: "Tower"

    ok_next:
      - to: ATC_VACATED_HANDOFF
        trigger: "vacat|clear.*runway|runway.*clear|off.*runway"
        label: "Pilot reported runway vacated"

    bad_next:
      - to: ATC_RUNWAY_VACATED_INCORRECT
        label: "Incomplete vacated call — controller prompts"

    auto_transitions:
      # Tower can see the aircraft slow to taxi speed after the rollout — the
      # handoff comes even when the pilot forgets to report vacated. Taxi speed
      # is unreachable before touchdown (final approach is 120+ kt over the
      # ground), so gs < 30 kt held 8 s can only mean landed and slowed.
      - to: ATC_VACATED_HANDOFF
        telemetry:
          parameter: gs_kts
          operator: lt
          value: 30
          for_ms: 8000
        label: "Telemetry: slowed to taxi speed — Tower initiates the handoff"

  ATC_RUNWAY_VACATED_INCORRECT:
    role: atc
    phase: tower
    name: "ATC Prompts for Runway Vacated Report"
    description: "Controller asks the pilot to report when the runway is vacated"
    say_template: "{{callsign}}, report runway vacated"
    frequency_name: "Tower"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_RUNWAY_VACATED
        label: "Prompt given — pilot to retry"

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Tower hands the pilot off to Ground
  # ─────────────────────────────────────────────────────────────────────────────
  ATC_VACATED_HANDOFF:
    role: atc
    phase: tower
    name: "Tower Hands Off to Ground"
    description: "Tower acknowledges the runway is vacated and instructs the pilot to contact Ground"
    say_template: "{{callsign}}, contact ground {{ground_freq}}"
    frequency_name: "Tower"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_GROUND_FREQ_READBACK
        label: "Ground handoff given — await pilot readback"
        on_enter_actions:
          - type: set_flag
            target: runway_vacated
            value: true

  PILOT_GROUND_FREQ_READBACK:
    role: pilot
    phase: tower
    name: "Pilot Reads Back Ground Frequency"
    description: "Pilot reads back the ground frequency and own callsign to confirm the frequency change"
    expected_pilot_template: "{{ground_freq}}, {{callsign}}"
    frequency_name: "Tower"

    readback_required:
      - ground_freq
    readback_mode: simple

    ok_next:
      - to: ATC_TOWER_LANDING_HANDOFF_CONFIRMED
        trigger: ".*"
        label: "Ground frequency readback evaluated — correct"

    bad_next:
      - to: ATC_GROUND_FREQ_READBACK_INCORRECT
        label: "Readback missing ground frequency — controller corrects"

    auto_transitions: []

  ATC_GROUND_FREQ_READBACK_INCORRECT:
    role: atc
    phase: tower
    name: "ATC Corrects Ground Frequency Readback"
    description: "Controller repeats the ground frequency for the pilot"
    say_template: "Negative, {{callsign}}, ground on {{ground_freq}}"
    frequency_name: "Tower"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_GROUND_FREQ_READBACK
        label: "Correction given — pilot to try again"

  # ─────────────────────────────────────────────────────────────────────────────
  # 5a. Go-around — Tower breaks off the approach
  # ─────────────────────────────────────────────────────────────────────────────
  # ICAO phraseology: the instruction is given twice, because it has to be acted
  # on before it is understood. The missed-approach altitude and the runway go
  # with it so the crew has somewhere to go.
  ATC_GO_AROUND:
    role: atc
    phase: tower
    name: "Tower Orders a Go-Around"
    description: "Tower breaks off the approach and sends the aircraft around"
    say_template: "{{callsign}}, GO AROUND, I say again, GO AROUND. Climb altitude {{go_around_altitude}} feet, runway heading, report passing {{go_around_altitude}} feet."
    frequency_name: "Tower"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_GO_AROUND_READBACK
        label: "Go-around ordered — awaiting readback"
        on_enter_actions:
          - type: set_flag
            target: go_around_flown
            value: true

  PILOT_GO_AROUND_READBACK:
    role: pilot
    phase: tower
    name: "Pilot Reads Back the Go-Around"
    description: "Pilot acknowledges the go-around and reads back the climb altitude"
    expected_pilot_template: "Going around, climbing {{go_around_altitude}} feet, {{callsign}}"
    frequency_name: "Tower"

    readback_required:
      - go_around_altitude
    readback_mode: simple

    ok_next:
      - to: ATC_GO_AROUND_VECTOR
        trigger: ".*"
        label: "Go-around readback evaluated — correct"

    bad_next:
      - to: ATC_GO_AROUND_READBACK_INCORRECT
        label: "Readback missing the climb altitude — controller corrects"

    auto_transitions: []

  ATC_GO_AROUND_READBACK_INCORRECT:
    role: atc
    phase: tower
    name: "Tower Repeats the Go-Around"
    description: "Controller repeats the go-around instruction and the climb altitude"
    say_template: "{{callsign}}, go around, climb altitude {{go_around_altitude}} feet, acknowledge"
    frequency_name: "Tower"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_GO_AROUND_READBACK
        label: "Repeated — pilot to acknowledge"

  # The aircraft is going back around for another approach, so it stays with
  # Tower and is handed to Approach for re-sequencing rather than to Ground.
  ATC_GO_AROUND_VECTOR:
    role: atc
    phase: tower
    name: "Tower Re-sequences the Approach"
    description: "Tower acknowledges the go-around and hands the aircraft back to Approach"
    say_template: "{{callsign}}, roger, contact Approach {{approach_freq}} for re-sequencing"
    frequency_name: "Tower"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_GO_AROUND_FREQ_READBACK
        label: "Handed back to Approach — awaiting frequency readback"

  PILOT_GO_AROUND_FREQ_READBACK:
    role: pilot
    phase: tower
    name: "Pilot Reads Back the Approach Frequency"
    description: "Pilot reads back the approach frequency after the go-around"
    expected_pilot_template: "{{approach_freq}}, {{callsign}}"
    frequency_name: "Tower"

    readback_required:
      - approach_freq
    readback_mode: simple

    ok_next:
      - to: ATC_GO_AROUND_HANDOFF_CONFIRMED
        trigger: ".*"
        label: "Frequency readback evaluated — correct"

    bad_next:
      - to: ATC_GO_AROUND_FREQ_READBACK_INCORRECT
        label: "Readback missing the approach frequency — controller corrects"

    auto_transitions: []

  ATC_GO_AROUND_FREQ_READBACK_INCORRECT:
    role: atc
    phase: tower
    name: "Tower Corrects the Approach Frequency Readback"
    description: "Controller repeats the approach frequency"
    say_template: "Negative, {{callsign}}, Approach on {{approach_freq}}"
    frequency_name: "Tower"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_GO_AROUND_FREQ_READBACK
        label: "Correction given — pilot to try again"

  ATC_GO_AROUND_HANDOFF_CONFIRMED:
    role: atc
    phase: tower
    name: "Tower Releases the Pilot to Approach"
    description: "Tower acknowledges the correct frequency readback and releases the pilot"
    say_template: "{{callsign}}, good day"
    frequency_name: "Tower"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: TOWER_GO_AROUND_COMPLETE
        label: "Go-around handled — back to Approach for another approach"

  TOWER_GO_AROUND_COMPLETE:
    role: system
    phase: tower
    name: "Go-Around Complete"
    description: "The approach was broken off. Switch to Approach {{approach_freq}} for re-sequencing."

    ok_next: []
    bad_next: []
    auto_transitions: []

  # ─────────────────────────────────────────────────────────────────────────────
  # 5b. Confirmations — a correct readback that leaves the pilot waiting
  # ─────────────────────────────────────────────────────────────────────────────
  # After the landing clearance readback the pilot lands; nothing further is due
  # from Tower until the runway is vacated, so the confirmation is what tells
  # them the clearance was correctly acknowledged.
  ATC_LANDING_READBACK_CORRECT:
    role: atc
    phase: tower
    name: "Tower Confirms Landing Readback"
    description: "Tower confirms the landing clearance readback was correct"
    say_template: "Readback correct, {{callsign}}"
    frequency_name: "Tower"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_RUNWAY_VACATED
        label: "Readback confirmed — continuing to land"

  ATC_TOWER_LANDING_HANDOFF_CONFIRMED:
    role: atc
    phase: tower
    name: "Tower Releases the Pilot to Ground"
    description: "Tower acknowledges the correct frequency readback and releases the pilot"
    say_template: "{{callsign}}, good day"
    frequency_name: "Tower"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: TOWER_LANDING_COMPLETE
        label: "Tower phase complete — pilot switching to Ground"

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. End state — switching to Ground for taxi-in
  # ─────────────────────────────────────────────────────────────────────────────
  TOWER_LANDING_COMPLETE:
    role: system
    phase: tower
    name: "Tower Landing Phase Complete"
    description: "Landed and clear of the runway. Switch to ground {{ground_freq}} for taxi to stand."

    ok_next: []
    bad_next: []
    auto_transitions: []

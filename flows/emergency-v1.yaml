slug: emergency-v1
schema_version: "2.0"
name: "Emergency Handling"
description: >
  MAYDAY / PAN-PAN emergency handling.
  Interrupts the active flow and automatically resumes it when resolved.

start_state: MAYDAY_DECLARED
end_states:
  - EMERGENCY_COMPLETE

entry_mode: interrupt

variables:
  # Level ATC assigns while the emergency is worked. Declared so a standalone
  # drill has a value; in an interrupt the session's own variables carry over.
  emergency_altitude:
    type: string
    initial: "3000"
    mutable_by: action_only
  runway:
    type: string
    initial: "25L"
    mutable_by: action_only
  qnh:
    type: string
    initial: "1013"
    mutable_by: action_only
  # What the pilot said they intend to do. Set by the engine from the MAYDAY
  # call itself when it was stated there, otherwise by the transition below —
  # so ATC does not ask again for something it has already been told.
  emergency_intention:
    type: string
    initial: ""
    mutable_by: action_only

flags:
  emergency_handled:
    initial: false

states:

  # ─────────────────────────────────────────────────────────────────────────────
  # 1. ATC acknowledges and asks for the standard emergency details
  # ─────────────────────────────────────────────────────────────────────────────
  # The squawk and the "all stations" broadcast belong here, with the very first
  # reply — repeating them later once the intentions are known would be wrong.
  MAYDAY_DECLARED:
    role: atc
    name: "MAYDAY Declared"
    description: "ATC acknowledges the emergency, assigns 7700 and requests emergency details"
    say_template: "{{callsign}}, MAYDAY acknowledged. All stations, MAYDAY traffic. Squawk 7700. Emergency services on standby. Say nature of emergency, persons on board, fuel remaining, and your intentions."

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_STATES_EMERGENCY
        label: "ATC ready — awaiting pilot emergency description"
        on_enter_actions:
          - type: set_flag
            target: emergency_handled
            value: true

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Pilot states the emergency — often with the intentions already in it
  # ─────────────────────────────────────────────────────────────────────────────
  # Each branch records what was intended and goes straight to the matching
  # instruction. Only a call that states no intention reaches the question.
  PILOT_STATES_EMERGENCY:
    role: pilot
    name: "Pilot States Emergency"
    description: "Pilot declares the nature of the emergency, souls on board, fuel, and intentions"
    expected_pilot_template: "MAYDAY MAYDAY MAYDAY, {{callsign}}, [nature of emergency], [persons on board], [fuel remaining], [intentions]"

    ok_next:
      - to: ATC_EMERGENCY_RETURN
        trigger: "return|returning|come back|back to (?:the )?(?:field|airport|departure)|land(?:ing)? (?:back|here|immediately|as soon)|immediate landing|request landing"
        label: "Pilot intends to return and land at this field"
        on_enter_actions:
          - type: set_variable
            target: emergency_intention
            value: "return"
      - to: ATC_EMERGENCY_DIVERT
        trigger: "divert|diverting|alternate|proceed to [A-Z]{4}|nearest (?:suitable )?(?:airport|airfield|aerodrome)"
        label: "Pilot intends to divert"
        on_enter_actions:
          - type: set_variable
            target: emergency_intention
            value: "divert"
      - to: ATC_EMERGENCY_HOLD
        trigger: "hold|holding|orbit|orbiting|stay|remain|need time|troubleshoot|run(?:ning)? (?:the )?checklist"
        label: "Pilot needs time to work the problem"
        on_enter_actions:
          - type: set_variable
            target: emergency_intention
            value: "hold"
      - to: ATC_EMERGENCY_CONTINUE
        trigger: "continue|continuing|proceed as|carry on|no assistance|situation under control|able to continue"
        label: "Pilot intends to continue as cleared"
        on_enter_actions:
          - type: set_variable
            target: emergency_intention
            value: "continue"
      # The intention was already stated in the MAYDAY call itself, which the
      # engine captured before this flow started. Matched on any utterance, so
      # the details call does not have to repeat it — asking again for what was
      # just said is the reported bug.
      - to: ATC_EMERGENCY_RETURN
        trigger: ".*"
        condition:
          type: variable_match
          name: emergency_intention
          value: "return"
        label: "Return already stated in the MAYDAY call"
      - to: ATC_EMERGENCY_DIVERT
        trigger: ".*"
        condition:
          type: variable_match
          name: emergency_intention
          value: "divert"
        label: "Diversion already stated in the MAYDAY call"
      - to: ATC_EMERGENCY_HOLD
        trigger: ".*"
        condition:
          type: variable_match
          name: emergency_intention
          value: "hold"
        label: "Hold already stated in the MAYDAY call"
      - to: ATC_EMERGENCY_CONTINUE
        trigger: ".*"
        condition:
          type: variable_match
          name: emergency_intention
          value: "continue"
        label: "Continuation already stated in the MAYDAY call"

      - to: ATC_ASK_INTENTIONS
        trigger: ".*"
        label: "Details given but no intentions stated — ATC asks"

    bad_next: []
    auto_transitions: []

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Only asked when the pilot has not already said what they want to do
  # ─────────────────────────────────────────────────────────────────────────────
  ATC_ASK_INTENTIONS:
    role: atc
    name: "ATC Asks for Intentions"
    description: "ATC has the emergency details but not the pilot's intentions"
    say_template: "{{callsign}}, roger. Say your intentions."

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_INTENTIONS
        label: "Question asked — awaiting pilot intentions"

  PILOT_INTENTIONS:
    role: pilot
    name: "Pilot States Intentions"
    description: "Pilot states what they intend to do — return, divert, hold or continue"
    expected_pilot_template: "{{callsign}}, [intentions — returning to the field / diverting to EDDF / holding / continuing]"

    ok_next:
      - to: ATC_EMERGENCY_RETURN
        trigger: "return|returning|come back|back to (?:the )?(?:field|airport|departure)|land(?:ing)? (?:back|here|immediately|as soon)|immediate landing|request landing"
        label: "Pilot intends to return and land at this field"
        on_enter_actions:
          - type: set_variable
            target: emergency_intention
            value: "return"
      - to: ATC_EMERGENCY_DIVERT
        trigger: "divert|diverting|alternate|proceed to [A-Z]{4}|nearest (?:suitable )?(?:airport|airfield|aerodrome)"
        label: "Pilot intends to divert"
        on_enter_actions:
          - type: set_variable
            target: emergency_intention
            value: "divert"
      - to: ATC_EMERGENCY_HOLD
        trigger: "hold|holding|orbit|orbiting|stay|remain|need time|troubleshoot|run(?:ning)? (?:the )?checklist"
        label: "Pilot needs time to work the problem"
        on_enter_actions:
          - type: set_variable
            target: emergency_intention
            value: "hold"
      - to: ATC_EMERGENCY_CONTINUE
        trigger: "continue|continuing|proceed as|carry on|no assistance|situation under control|able to continue"
        label: "Pilot intends to continue as cleared"
        on_enter_actions:
          - type: set_variable
            target: emergency_intention
            value: "continue"

    bad_next:
      - to: ATC_INTENTIONS_UNCLEAR
        label: "Intentions not understood — ATC asks again"

    auto_transitions: []

  ATC_INTENTIONS_UNCLEAR:
    role: atc
    name: "ATC Re-asks for Intentions"
    description: "ATC did not understand the intentions and offers the standard options"
    say_template: "{{callsign}}, say again your intentions. Do you wish to return, divert, hold, or continue?"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_INTENTIONS
        label: "Asked again — awaiting pilot intentions"

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. One instruction per intention — each is an actual clearance, not an ack
  # ─────────────────────────────────────────────────────────────────────────────
  ATC_EMERGENCY_RETURN:
    role: atc
    name: "ATC Clears the Return"
    description: "ATC turns the aircraft back towards the field and sets up the approach"
    say_template: "{{callsign}}, roger, cleared to return. Descend altitude {{emergency_altitude}} feet, QNH {{qnh}}, expect vectors for the approach runway {{runway}}. Report when ready for the approach."

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_APPROACH_READBACK
        label: "Return cleared — awaiting readback"

  ATC_EMERGENCY_DIVERT:
    role: atc
    name: "ATC Clears the Diversion"
    description: "ATC clears the aircraft towards the alternate"
    say_template: "{{callsign}}, roger, cleared to divert. Descend altitude {{emergency_altitude}} feet, QNH {{qnh}}, own navigation to your alternate. Report your alternate and endurance."

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_LEVEL_READBACK
        label: "Diversion cleared — awaiting readback"

  ATC_EMERGENCY_HOLD:
    role: atc
    name: "ATC Assigns a Hold"
    description: "ATC gives the pilot airspace and time to work the problem"
    say_template: "{{callsign}}, roger, maintain altitude {{emergency_altitude}} feet, QNH {{qnh}}, hold present position, right turns. Airspace is clear of traffic. Advise when ready to proceed."

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_LEVEL_READBACK
        label: "Hold assigned — awaiting readback"

  ATC_EMERGENCY_CONTINUE:
    role: atc
    name: "ATC Acknowledges Continuation"
    description: "The pilot is able to continue as cleared; ATC keeps the emergency status alive"
    say_template: "{{callsign}}, roger, continue as cleared. Emergency services remain on standby. Report any change in your situation."

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_CONTINUE_ACK
        label: "Continuation acknowledged — awaiting pilot acknowledgement"

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. Readbacks — the level is a mandatory readback item like any other
  # ─────────────────────────────────────────────────────────────────────────────
  PILOT_APPROACH_READBACK:
    role: pilot
    name: "Pilot Reads Back the Return Clearance"
    description: "Pilot reads back the assigned altitude and the approach runway"
    expected_pilot_template: "Descend altitude {{emergency_altitude}} feet, QNH {{qnh}}, approach runway {{runway}}, {{callsign}}"

    readback_required:
      - emergency_altitude
      - runway
    readback_mode: simple

    ok_next:
      - to: ATC_EMERGENCY_HANDLED
        trigger: ".*"
        label: "Return readback evaluated — correct"

    bad_next:
      - to: ATC_APPROACH_READBACK_INCORRECT
        label: "Readback missing altitude or runway — controller corrects"

    auto_transitions: []

  ATC_APPROACH_READBACK_INCORRECT:
    role: atc
    name: "ATC Corrects the Return Readback"
    description: "Controller repeats the altitude and runway"
    say_template: "Negative, {{callsign}}, say again: descend altitude {{emergency_altitude}} feet, approach runway {{runway}}"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_APPROACH_READBACK
        label: "Correction given — pilot to try again"

  PILOT_LEVEL_READBACK:
    role: pilot
    name: "Pilot Reads Back the Assigned Level"
    description: "Pilot reads back the altitude assigned for the diversion or the hold"
    expected_pilot_template: "Altitude {{emergency_altitude}} feet, QNH {{qnh}}, {{callsign}}"

    readback_required:
      - emergency_altitude
    readback_mode: simple

    ok_next:
      - to: ATC_EMERGENCY_HANDLED
        trigger: ".*"
        label: "Level readback evaluated — correct"

    bad_next:
      - to: ATC_LEVEL_READBACK_INCORRECT
        label: "Readback missing the assigned altitude — controller corrects"

    auto_transitions: []

  ATC_LEVEL_READBACK_INCORRECT:
    role: atc
    name: "ATC Corrects the Level Readback"
    description: "Controller repeats the assigned altitude"
    say_template: "Negative, {{callsign}}, say again: altitude {{emergency_altitude}} feet, QNH {{qnh}}"

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: PILOT_LEVEL_READBACK
        label: "Correction given — pilot to try again"

  PILOT_CONTINUE_ACK:
    role: pilot
    name: "Pilot Acknowledges"
    description: "Pilot acknowledges that they continue as cleared"
    expected_pilot_template: "Wilco, {{callsign}}"

    ok_next:
      - to: ATC_EMERGENCY_HANDLED
        trigger: ".*"
        label: "Pilot acknowledged — emergency handling settled"

    bad_next: []
    auto_transitions: []

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. Emergency settled — the orchestrator resumes the interrupted flow
  # ─────────────────────────────────────────────────────────────────────────────
  ATC_EMERGENCY_HANDLED:
    role: atc
    name: "ATC Confirms the Plan"
    description: "ATC confirms the agreed plan and stays available"
    say_template: "{{callsign}}, readback correct. Advise if you require anything further."

    ok_next: []
    bad_next: []
    auto_transitions:
      - to: EMERGENCY_COMPLETE
        label: "Emergency handling complete"

  EMERGENCY_COMPLETE:
    role: system
    name: "Emergency Resolved"
    description: "Emergency handling complete. Flow orchestrator resumes the interrupted flow."

    ok_next: []
    bad_next: []
    auto_transitions: []

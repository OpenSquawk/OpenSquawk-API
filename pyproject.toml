[tool.poetry]
name = "opensquawk-liveatc-api"
version = "2.0.0"
description = "PM radio training backend"
authors = ["najajan <jan@najajan.de>"]
readme = "README.md"
homepage = "https://opensquawk.de/"
repository = "https://github.com/OpenSquawk/OpenSquawk-LiveATC-api"
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = {extras = ["standard"], version = "^0.115.0"}
pyyaml = "^6.0"
pydantic = "^2.0"
jellyfish = "^1.0"
httpx = "^0.27"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-asyncio = "^0.24"
httpx = "^0.27"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Pins the loop scope pytest-asyncio would otherwise warn about choosing for us.
asyncio_default_fixture_loop_scope = "function"
# Python 3.14 deprecated two asyncio helpers that FastAPI/Starlette and
# pytest-asyncio still call internally. They fired once per request and per
# async test, burying the run in ~28k warnings and hiding anything real. Silenced
# by module, not globally, so a deprecation in our own code is still visible;
# both go away when those packages catch up.
filterwarnings = [
    "default",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:fastapi.routing",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:starlette.*",
    "ignore:'asyncio.get_event_loop_policy' is deprecated:DeprecationWarning:pytest_asyncio.plugin",
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:pytest_asyncio.plugin",
]
